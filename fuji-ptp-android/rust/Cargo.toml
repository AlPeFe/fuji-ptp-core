[package]
name = "fuji-ptp-android"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fuji-ptp-core = { path = "../.." }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
fuji-ptp-core = { path = "../..", features = [] }
